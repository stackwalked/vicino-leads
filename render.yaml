services:
  - type: web
    name: vicino-leads
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # One worker: searches run in a background thread inside it.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONTHLY_REQUEST_CAP
        value: "900"
