<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · Vicino Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { --bg: #eceff2; --surface: #fff; --ink: #18212c; --muted: #5a6575; --line: #d4dae2; --accent: #23489f; --accent-ink: #fff; --hot: #c8391f;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #11151b; --surface: #19202a; --ink: #e5e9ef; --muted: #98a3b4; --line: #2a3441; --accent: #8fabff; --accent-ink: #0f1830; --hot: #ff7a5e; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); padding: 16px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 28px 24px; display: grid; gap: 14px; }
h1 { font: 800 28px/1 var(--display); font-stretch: 78%; text-transform: uppercase; margin: 0 0 4px; }
h1 span { color: var(--accent); }
p { margin: 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
input { font: inherit; color: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--hot); font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Vicino <span>Leads</span></h1>
  <p>Milan venues that need a better online presence.</p>
  <div class="err" id="err" hidden></div>
  <label>Your name <input name="name" id="name" autocomplete="given-name" required maxlength="40" placeholder="Shown next to notes you write"></label>
  <label>Password <input name="password" id="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
<script>
const e = new URLSearchParams(location.search).get("e");
const msg = { bad: "That password isn't right.", setup: "The server has no password set yet. Add APP_PASSWORD in the hosting settings." }[e];
if (msg) { const el = document.getElementById("err"); el.textContent = msg; el.hidden = false; }
</script>
</body>
</html>
